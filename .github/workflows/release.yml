---
name: release
on:
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/heads/REL-')
    env:
      MAVEN_ARGS: '--no-transfer-progress --color always'
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-java@v6
      with:
        distribution: 'temurin'
        java-version: 11
        cache: maven
        server-id: central
        server-username-env-var: CENTRAL_USERNAME
        server-password-env-var: CENTRAL_PASSWORD
        gpg-private-key: ${{ secrets.GPG_SECRET_KEY }}
    - name: Release
      run: |
        git config --global user.name 'github actions'
        git config --global user.email 'github@mmprogrami.nl'
        mvn -Pdeploy,central --batch-mode   release:prepare release:perform
      env:
        CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
        CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
        GPG_PASSPHRASE: ${{ secrets.GPG_SECRET_KEY_PASSPHRASE }}
